<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge Panel Reference</title>
<style>
  /* Reference styling for the three nudge tiers (Sevaro brief, Figure 3). Copy freely. */
  :root { --ink:#1b1f24; --muted:#5b6773; --line:#d9dee4; --bg:#f4f6f8; --card:#fff;
          --hard:#c62828; --hard-bg:#fdecea; --adv:#b7791f; --adv-bg:#fff4dc; --info:#1e63c6; --info-bg:#e8f1fd; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#0f2a4a; color:#fff; padding:12px 20px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  header b { font-size:1.05rem } header .sub { opacity:.85; font-size:.88rem }
  header select, header input { font:inherit; padding:4px 6px; border-radius:6px; border:0; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:18px; padding:18px 20px; max-width:1280px; margin:auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .tabs button { border:0; background:none; padding:8px 12px; font:inherit; cursor:pointer; color:var(--muted); border-bottom:3px solid transparent; }
  .tabs button.on { color:var(--ink); border-color:#0f2a4a; font-weight:600; }
  .row { display:grid; grid-template-columns: 230px minmax(0,1fr); gap:10px; align-items:start; padding:9px 0; border-bottom:1px dashed #eef0f3; }
  .row label { color:var(--muted); padding-top:4px; display:flex; gap:6px; align-items:center; }
  .seg button { font:inherit; padding:3px 12px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .seg button:first-child { border-radius:12px 0 0 12px } .seg button:last-child { border-radius:0 12px 12px 0 }
  .seg button.on { background:#0f2a4a; color:#fff; border-color:#0f2a4a; }
  input[type=text], textarea { font:inherit; width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:6px; }
  .primary { font:inherit; background:#0f2a4a; color:#fff; border:0; border-radius:8px; padding:7px 16px; cursor:pointer; }
  .primary:disabled { background:#9aa5b1; cursor:not-allowed; }
  /* ---- tier: ADVISORY (inline, next to the field, does not block) ---- */
  .nudge { border-left:5px solid; border-radius:8px; padding:8px 12px; margin-top:8px; font-size:.92rem; }
  .nudge .t { font-weight:700 } .nudge .meta { font-size:.76rem; color:#444; margin-top:4px }
  .nudge.advisory { border-color:var(--adv); background:var(--adv-bg); }
  .nudge.info { border-color:var(--info); background:var(--info-bg); }
  .chip { display:inline-block; font-size:.7rem; color:#fff; border-radius:9px; padding:0 7px; margin-right:4px; vertical-align:1px; }
  /* ---- tier: INFO (icon by the field + side panel, never interrupts) ---- */
  .i-dot { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--info);
           color:var(--info); font-size:.7rem; font-weight:700; cursor:pointer; }
  /* ---- tier: HARD STOP (blocks the action until fixed) ---- */
  .overlay { position:fixed; inset:0; background:rgba(15,42,74,.35); display:none; place-items:center; padding:16px; }
  .overlay.show { display:grid; }
  .hard { background:#fff; border:2px solid var(--hard); border-radius:12px; max-width:520px; width:100%; padding:16px 18px; }
  .hard h3 { margin:0 0 6px; color:var(--hard); }
  .hard .acts { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; margin-bottom:10px; }
  .stats div { background:var(--bg); border-radius:8px; padding:6px; } .stats b { display:block; font-size:1.3rem; }
  .quiet { border:1px dashed #9aa5b1; border-radius:8px; padding:10px; color:var(--muted); font-size:.9rem; }
  .muted { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<header>
  <div><b id="hname">…</b> · <span id="ctypeLbl">Stroke</span> · Patient: Synthetic, Test
    <div class="sub" id="times"></div></div>
  <span style="flex:1"></span>
  <select id="hosp" aria-label="Hospital"></select>
  <select id="ctype" aria-label="Consult type"><option>Stroke</option><option>General Neuro</option><option>Rounding</option></select>
  <input id="ltime" type="datetime-local" value="2026-03-17T19:30" aria-label="Hospital-local time">
</header>

<main>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="step"></div>
  </section>
  <aside>
    <div class="panel">
      <h3 style="margin:0 0 8px">Workflow Companion</h3>
      <div class="stats"><div><b id="sEv">0</b>events</div><div><b id="sRules">0</b>rules checked</div><div><b id="sShown">0</b>surfaced</div></div>
      <div class="muted" id="sNote"></div>
      <h4 style="margin:14px 0 6px">Info (on demand)</h4>
      <div id="infoPanel"><div class="quiet">Nothing here yet.</div></div>
    </div>
  </aside>
</main>

<div class="overlay" id="overlay"><div class="hard" id="hardBox"></div></div>

<script>
// ===== 1. Caselog definition: which fields each step shows, and the event each field sends =====
const STEPS = {
  "Stroke": ["Intake","History","Imaging","Recommendation","Note","Sign-off"],
  "General Neuro": ["Intake","History","Recommendation","Note","Sign-off"],
  "Rounding": ["Rounding","Note","Sign-off"],
};
const FIELDS = {   // step -> [label, event field name, input type]
  "Intake": [["Reason for consult", null, "text"]],
  "History": [["Last known well", "last_known_well", ["Known","Unknown"]], ["Allergies (press Enter)", "allergies", "text"]],
  "Imaging": [["CT head done", null, ["No","Yes"]], ["CTA done", "cta_done", ["No","Yes"]],
              ["Large vessel occlusion present", "lvo_present", ["No","Yes"]]],
  "Recommendation": [["Thrombolytic given", "thrombolytic_given", ["No","Yes"]],
                     ["Thrombolytic order placed in EHR?", null, ["No","Yes"]],
                     ["Assessment / plan (click away to apply)", "assessment", "area"]],
  "Note": [["Note title", null, "text"]],
  "Rounding": [], "Sign-off": [],
};
const BOOL = v => v === "Yes" ? true : v === "No" ? false : v;

let S = { hosp:null, ctype:"Stroke", step:null, nudges:{}, events:0, rules:0, shown:0, charge:false, plan:false, values:{} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ===== 2. The ONLY call the UI makes for nudges: send the encounter context, draw what comes back =====
async function fire(field, value) {
  const ctx = { hospital_id:S.hosp, consult_type:S.ctype, encounter_type: S.ctype==="Rounding" ? "Rounding" : "Acute",
                caselog_step:S.step, field_event:{ field, value }, local_time:$("ltime").value,
                provider_timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
                charge_entered:S.charge, plan_confirmed:S.plan };
  const res = await fetch("/nudges", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(ctx) }).then(r => r.json());
  // replace any earlier nudge that came from the same field (e.g. LVO toggled back to No)
  for (const [k,n] of Object.entries(S.nudges)) if (n.trigger_field === field) delete S.nudges[k];
  for (const n of res.nudges) S.nudges[n.key] = n;
  S.events++; S.rules += res.rules_checked; S.shown += res.nudges.length;
  $("sNote").textContent = `${res.guide_fields} guide fields at this hospital · ${S.rules - S.shown} checks stayed silent · ${res.ms} ms`;
  render();
  return res.nudges;
}

// ===== 3. Rendering: every nudge says where it goes via nudge.display.placement =====
function chips(n) {
  const col = { answered:"#2e7d32", not_in_guide:"#6d4c41", time_dependent:"#6a1b9a", stale:"#b7791f", conflict:"#c62828", hard_stop:"#c62828" };
  let h = `<span class="chip" style="background:${col[n.status]||'#555'}">${esc(n.status.replace(/_/g," "))}</span>`;
  for (const f of n.flags) if (f !== n.status) h += `<span class="chip" style="background:${col[f]||'#555'}">${esc(f)}</span>`;
  return h;
}
function cardHTML(n) {
  const src = n.sources.map(s => `${s.hospital_id} → ${s.field} (verified ${s.last_verified})`).join(" · ");
  return `<div class="nudge ${n.tier}">${chips(n)}<div class="t">${esc(n.title)}</div><div>${esc(n.message)}</div>
    ${n.details.map(d => `<div class="muted">• ${esc(d)}</div>`).join("")}
    <div class="meta"><b>Why:</b> ${esc(n.why)}</div><div class="meta"><b>Source:</b> ${esc(src || "—")}</div></div>`;
}
function render() {
  const all = Object.values(S.nudges);
  // advisory -> inline, under the field it belongs to (display.anchor_field)
  document.querySelectorAll("[data-slot]").forEach(el => {
    el.innerHTML = all.filter(n => n.display.placement === "inline" && n.display.anchor_field === el.dataset.slot).map(cardHTML).join("");
  });
  // info -> small (i) next to the field + full card in the side panel; never interrupts
  document.querySelectorAll("[data-dot]").forEach(el => {
    const has = all.some(n => n.display.placement === "side_panel" && n.display.anchor_field === el.dataset.dot);
    el.innerHTML = has ? `<span class="i-dot" title="Info available in the side panel">i</span>` : "";
  });
  const infos = all.filter(n => n.display.placement === "side_panel");
  $("infoPanel").innerHTML = infos.length ? infos.map(cardHTML).join("") : `<div class="quiet">Nothing needs your attention — staying quiet.</div>`;
  // hard stop -> modal that blocks the action (display.blocked_action)
  const hard = all.filter(n => n.display.placement === "blocking");
  if (hard.length) {
    $("hardBox").innerHTML = `<h3>⛔ ${esc(hard[0].title)}</h3>` + hard.map(cardHTML).join("").replaceAll('class="nudge hard_stop"','class="nudge" style="border-color:var(--hard);background:var(--hard-bg)"')
      + `<div class="acts">
           ${hard.some(n => /charge/i.test(n.message)) ? `<button class="primary" onclick="fix('charge')">Enter charge</button>` : ""}
           ${hard.some(n => /confirm/i.test(n.message)) ? `<button class="primary" onclick="fix('plan')">Hospital provider confirmed plan</button>` : ""}
           <button onclick="$('overlay').classList.remove('show')">Back to caselog</button></div>`;
    $("overlay").classList.add("show");
  } else $("overlay").classList.remove("show");
  const signBtn = $("signBtn");
  if (signBtn) signBtn.disabled = hard.length > 0;
  $("sEv").textContent = S.events; $("sRules").textContent = S.rules; $("sShown").textContent = S.shown;
}
async function fix(what) {          // resolving a hard stop re-checks sign-off with the new state
  if (what === "charge") S.charge = true; else S.plan = true;
  await fire("complete_clicked", true);
  if (!Object.values(S.nudges).some(n => n.tier === "hard_stop")) $("step").insertAdjacentHTML("beforeend", `<p style="color:#2e7d32"><b>✔ Ready to sign off.</b></p>`);
}

// ===== 4. Caselog screen =====
function drawStep() {
  $("tabs").innerHTML = STEPS[S.ctype].map(s => `<button class="${s===S.step?'on':''}" onclick="goStep('${s}')">${s}</button>`).join("");
  let h = "";
  for (const [label, ev, type] of FIELDS[S.step] || []) {
    const v = S.values[label] ?? (Array.isArray(type) ? type[0] : "");
    let input;
    if (Array.isArray(type)) input = `<span class="seg">${type.map(o => `<button class="${o===v?'on':''}" onclick="setVal('${label}','${ev||''}','${o}')">${o}</button>`).join("")}</span>`;
    else if (type === "area") input = `<textarea rows="2" onchange="setVal('${label}','${ev||''}',this.value)">${esc(v)}</textarea>`;
    else input = `<input type="text" value="${esc(v)}" onchange="setVal('${label}','${ev||''}',this.value)">`;
    h += `<div class="row"><label>${esc(label)} ${ev ? `<span data-dot="${ev}"></span>` : ""}</label><div>${input}${ev ? `<div data-slot="${ev}"></div>` : ""}</div></div>`;
  }
  if (S.step === "Note") h += `<div class="row"><label>Note</label><div><button class="primary" onclick="fire('note_created', true)">Create note</button><div data-slot="note_created"></div></div></div>`;
  if (S.step === "Rounding") h += `<p class="muted">Rounding encounter opened — the companion checked this hospital's rounding days and hours.</p><div data-slot="encounter"></div>`;
  if (S.step === "Intake") h += `<div data-slot="encounter"></div>`;
  if (S.step === "Sign-off") h += `<div class="row"><label>Complete consult</label><div><button class="primary" id="signBtn" onclick="fire('complete_clicked', true)">Complete consult</button></div></div>`;
  $("step").innerHTML = h;
  render();
}
function setVal(label, ev, v) { S.values[label] = v; drawStep(); if (ev) fire(ev, BOOL(v)); }
function goStep(s) { S.step = s; drawStep(); if (s === "Recommendation" && S.ctype === "Stroke") fire("order_field_displayed", true); }
function header() {
  const opt = $("hosp").selectedOptions[0];
  $("hname").textContent = opt ? opt.textContent : "";
  $("ctypeLbl").textContent = S.ctype;
  const tz = opt ? opt.dataset.tz : "";
  $("times").textContent = `Hospital-local time ${$("ltime").value.replace("T"," ")} (${tz}) · you: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;
}
async function newEncounter() {
  S = { ...S, hosp:$("hosp").value, ctype:$("ctype").value, nudges:{}, events:0, rules:0, shown:0, charge:false, plan:false, values:{} };
  S.step = STEPS[S.ctype][0]; header(); drawStep();
  await fire("encounter", "opened");          // encounter opened -> Intake / Rounding rules
}
(async function init() {
  const hs = await fetch("/hospitals").then(r => r.json());
  $("hosp").innerHTML = hs.map(h => `<option value="${h.hospital_id}" data-tz="${h.timezone}" ${h.hospital_id==="SYN-006"?"selected":""}>${esc(h.hospital_name)} (${h.hospital_id})</option>`).join("");
  ["hosp","ctype","ltime"].forEach(id => $(id).addEventListener("change", newEncounter));
  newEncounter();
})();
</script>
</body>
</html>
